# Inventory: рабочие станции и VPS.
#
# Секретов здесь нет и быть не должно (репозиторий публичный).
# Ключи S3, пароль restic и прочее передаются через ansible-vault
# (group_vars/vault.yml) или через --extra-vars.

[workstations]
omamac ansible_connection=local

[vps]
cloudcode ansible_host=100.73.91.4 ansible_user=mfesenko
proxy     ansible_host=100.121.120.33 ansible_user=mfesenko

# Хосты, на которых развёрнут restic-бэкап (групповые проверки/прогоны)
[backup_hosts:children]
vps

# Хосты, где применимы изменения под root (passwordless sudo)
[root_capable:children]
vps
